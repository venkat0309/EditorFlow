spring:
  application:
    name: editorflow

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:editorflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:P@venkat3}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:7f6b5e4a3d2c1b0a9f8e7d6c5b4a3928172635445566778899aabbccddeeff11}
  expiration: ${JWT_EXPIRATION:86400000}